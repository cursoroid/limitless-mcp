services:
  db:
    image: postgres:16
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"  # local dev / pytest from host only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 3s
      retries: 30

  mcp:
    build: ./mcp
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # localhost only: for Inspector / host debugging
    volumes:
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  agent:
    build: ./agent
    env_file: .env
    depends_on:
      mcp:
        condition: service_healthy
    stdin_open: true
    tty: true

volumes:
  pgdata:
